<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Dijo que sí!</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Cinzel y Lora -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        /* Fondo oscuro estilo noche/muros */
        body {
            background-color: #1E1A17; 
            font-family: 'Lora', serif;
            color: #D4CEB0; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#2A241F 1px, transparent 1px);
            background-size: 20px 20px; 
            margin: 0;
            padding: 20px;
        }

        .papel-victoria {
            background: linear-gradient(145deg, #2A241F, #1E1A17);
            border: 2px solid #5C4033;
            border-radius: 10px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(42, 59, 36, 0.6); /* Resplandor verde de victoria */
            text-align: center;
            position: relative;
            max-width: 600px;
        }

        /* Título de victoria */
        .titulo-victoria {
            font-family: 'Cinzel', serif;
            color: #A9B89D; /* Verde Legión claro */
            text-shadow: 2px 2px 10px rgba(42, 59, 36, 0.8);
            font-size: 2.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .texto-carta {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            line-height: 1.8;
            color: #E8E3D2;
            font-style: italic;
            margin-bottom: 30px;
        }

        .imagen-victoria {
            width: 100%;
            max-width: 300px;
            border: 3px solid #5C4033;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        /* Animación de entrada suave */
        .aparecer {
            opacity: 0;
            transform: scale(0.9);
            animation: zoomIn 1.5s ease-out forwards;
        }

        @keyframes zoomIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Botón para avisarte por WhatsApp */
        .btn-aviso {
            background-color: #2A3B24;
            color: white;
            border: 2px solid #1A2416;
            border-radius: 5px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-aviso:hover {
            background-color: #D4CEB0;
            color: #1E1A17;
            border-color: #D4CEB0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                
                <div class="papel-victoria aparecer">
                    
                    <h1 class="titulo-victoria">Completamos nuestra primera misión!</h1>
                    
                    <!-- Aquí puedes poner un GIF romántico, épico de AoT, o una foto de ustedes -->
                    <div class="tenor-gif-embed" data-postid="21050930" data-share-method="host" data-aspect-ratio="1.78771" data-width="100%"><a href="https://tenor.com/view/aot-gif-21050930">Aot GIF</a>from <a href="https://tenor.com/search/aot-gifs">Aot GIFs</a></div> <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

                    <p class="texto-carta">
                       A partir de hoy, consagremos nuestros corazones y avancemos juntos en esta aventura. 
                       Te quiero demasado mi Ambar, y estoy emocionado por todo lo que nos espera.
                    </p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
